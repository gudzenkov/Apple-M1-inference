defaults:
  families:
    qwen:
      capabilities:
        reasoning_supported: true
      context: 262144

profiles:
  mlx/qwen:
    reasoning:
      format: qwen

  mlx-optiq/qwen:
    reasoning:
      format: qwen

  vllm-metal/qwen:
    capabilities:
      tool_calling_supported: true
    reasoning:
      format: qwen

  llama.cpp/qwen:
    capabilities:
      reasoning_supported: false

models:
  - mlx-qwen3.5-9b-optiq-q4:
      model:
        name: mlx-community/Qwen3.5-9B-OptiQ-4bit
        size: 9
        quant: 4
      runtime:
        server: mlx-optiq
      family: qwen
      aliases:
        - optiq-9b

  - mlx-qwen3.5-9b-q4:
      model:
        name: mlx-community/Qwen3.5-9B-4bit
        size: 9
        quant: 4
      runtime:
        server: mlx
      family: qwen
      aliases:
        - qwen-9b

  - mlx-qwen3.5-27b-opus-q4:
      model:
        name: mlx-community/Qwen3.5-27B-Claude-4.6-Opus-Distilled-MLX-4bit
        size: 27
        quant: 4
      runtime:
        server: mlx
      family: qwen
      aliases:
        - opus-27b

  - mlx-qwen3.5-35b-a3b-q4:
      model:
        name: mlx-community/Qwen3.5-35B-A3B-4bit
        size: 35
        quant: 4
      runtime:
        server: mlx
      family: qwen
      aliases:
        - qwen-35b-a3b

  - vllm-metal-qwen3.6-35b-a3b-dwq-q4:
      model:
        name: qwen3.6-35b-a3b
        size: 35
        quant: 4
      runtime:
        server: vllm-metal
      family: qwen
      capabilities:
        source_model: mlx-community/Qwen3.6-35B-A3B-4bit-DWQ
        tokenizer_model: mlx-community/Qwen3.6-35B-A3B-4bit-DWQ
      aliases:
        - vllm-qwen-35b-a3b
        - qwen3.6-35b-a3b
        - mlx-community/qwen3.6-35b-a3b-4bit-dwq

  - llama.cpp-qwen3.5-9b-q4-k-m:
      model:
        name: unsloth/Qwen3.5-9B-GGUF:Q4_K_M
        size: 9
        quant: 4
      runtime:
        server: llama.cpp
      family: qwen
      capabilities:
        tokenizer_model: Qwen/Qwen3.5-9B
      aliases:
        - llama-cpp-qwen-9b
        - llama-cpp-9b
